# ============================================
# NGINX SERVER CONFIGURATION - Frontend Bank
# Configuración para SPA Angular con rutas client-side
# ============================================

server {
    # Escuchar en puerto no-root (8080)
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Charset
    charset utf-8;

    # ============================================
    # RUTAS PRINCIPALES
    # ============================================

    # Ruta raíz - servir index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============================================
    # ARCHIVOS ESTÁTICOS - CACHING AGRESIVO
    # ============================================

    # JavaScript (hashed por Angular build)
    location ~* \.(js|mjs)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # CSS (hashed por Angular build)
    location ~* \.css$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fonts
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Imágenes
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 6M;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # JSON y otros assets
    location ~* \.(json|xml|txt)$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # ============================================
    # SEGURIDAD
    # ============================================

    # Ocultar versiones de nginx
    server_tokens off;

    # Denegar acceso a archivos ocultos
    location ~ /\. {
        deny all;
        return 404;
    }

    # Denegar acceso a archivos sensibles
    location ~* \.(git|env|config|lock)$ {
        deny all;
        return 404;
    }

    # Denegar acceso a carpetas de sistema
    location ~ ^/(node_modules|\.git|\.env) {
        deny all;
        return 404;
    }

    # ============================================
    # API PROXY (si es necesario)
    # ============================================

    # Descomentar si necesitas proxy al backend
    # location /api/ {
    #     proxy_pass http://backend:8080/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_cache_bypass $http_upgrade;
    #     proxy_read_timeout 86400;
    # }

    # ============================================
    # MANEJO DE ERRORES
    # ============================================

    # Error 404 - redirigir a index.html (SPA routing)
    error_page 404 /index.html;

    # Error 500
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ============================================
    # COMPRESIÓN
    # ============================================

    # Archivos estáticos comprimidos
    location ~* \.(?:css|js|woff2?)$ {
        gzip_static on;
    }

    # ============================================
    # COORS (si es necesario)
    # ============================================

    # Configuración CORS para assets
    location ~* \.(woff2?|ttf|otf|eot)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    }
}
